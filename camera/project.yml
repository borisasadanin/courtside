name: CourtsideCamera
options:
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"

packages:
  HaishinKit:
    url: https://github.com/shogo4405/HaishinKit.swift
    # Pinned: a new 2.x arriving at build time could change how a dropped
    # connection is reported (StreamService watches the RTMP status). Move it
    # on purpose and test a reconnect when you do.
    exactVersion: "2.2.5"

targets:
  CourtsideCamera:
    type: application
    platform: iOS
    sources:
      - CourtsideCamera
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    dependencies:
      - package: HaishinKit
        product: HaishinKit
      - package: HaishinKit
        product: RTMPHaishinKit
    settings:
      base:
        INFOPLIST_KEY_NSCameraUsageDescription: "Kameran används för att sända live och för att skanna klubbens parningskod"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Mikrofonen används för ljud i livesändningen"
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIBackgroundModes: audio
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        SWIFT_EMIT_LOC_STRINGS: true
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_FILE: CourtsideCamera/Info.plist
        CURRENT_PROJECT_VERSION: 8
        MARKETING_VERSION: 1.5.1
        PRODUCT_BUNDLE_IDENTIFIER: $(COURTSIDE_BUNDLE_ID)
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        DEVELOPMENT_TEAM: ""
